name: Notify Agent Log Writer

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build deploy summary from commit
        id: summary
        run: |
          MSG="${{ github.event.head_commit.message }}"
          CHANGED="${{ join(github.event.head_commit.modified, ', ') }}"
          echo "summary=Deployed to production. Commit: ${MSG}${CHANGED:+ | Files: ${CHANGED}}" >> $GITHUB_OUTPUT

      - name: Dispatch to reporting repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.KILLERGROWTH_REPO_TOKEN }}
          repository: killergrowth/killergrowth-reporting
          event-type: agent-log-deploy
          client-payload: |
            {
              "client": "wheatland",
              "agent": "Norris Jr",
              "summary": "${{ steps.summary.outputs.summary }}"
            }