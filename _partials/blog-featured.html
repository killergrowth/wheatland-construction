<div class="blog-card">
  <a href="{{url}}"><img loading="lazy" src="{{image}}" alt="{{title}}"></a>
  <div class="blog-card-body">
    <div class="post-date">{{day}} {{month_year}}</div>
    <h3><a href="{{url}}">{{title}}</a></h3>
    <div class="post-excerpt">{{excerpt_html}}</div>
    <a href="{{url}}" class="read-more" aria-label="Read more about {{title}}">Read More &rsaquo;</a>
  </div>
</div>
